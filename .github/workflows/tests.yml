name: Unit Tests

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.7', '3.8', '3.9', '3.10', '3.11']
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
    
    - name: Build C library
      run: |
        mkdir -p build
        cd build
        cmake -DNUM_CHANLS=1 -DLOGGING_LEVEL=1 ..
        make PmuEstimatorShared
        make PmuEstimatorStatic
        cd ..
    
    - name: Install C library
      run: |
        cd build
        sudo cmake --install .
        cd ..
        # Verify library installation
        ls -la /usr/local/lib/libpmu_estimator.* || true
        sudo ldconfig
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python/requirements-test.txt
    
    - name: Install Python package
      run: |
        pip install ./python
    
    - name: Run unit tests with pytest
      run: |
        cd python
        python -m pytest test_pmu_estimator.py -v --tb=short
    
    - name: Run unit tests with unittest (fallback)
      if: failure()
      run: |
        cd python
        python -m unittest test_pmu_estimator -v
    
    - name: Test Python examples
      run: |
        cd python/examples
        python example_usage.py

  test-c-library:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
    
    - name: Build and test C library
      run: |
        mkdir -p build
        cd build
        cmake -DNUM_CHANLS=1 -DLOGGING_LEVEL=2 ..
        make PmuEstimatorShared
        make PmuEstimatorStatic
        cd ..
    
    - name: Install C library
      run: |
        cd build
        sudo cmake --install .
        cd ..
    
    - name: Build C test executables
      run: |
        cd test
        make test
        make test2
    
    - name: Run performance benchmark
      run: |
        cd test
        make benchmark
        if [ -f pmu_perf.csv ]; then
          echo "Performance benchmark completed successfully"
          cat pmu_perf.csv
        fi
    
    - name: Clean test directory
      run: |
        cd test
        make clean
